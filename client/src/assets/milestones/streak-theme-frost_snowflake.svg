<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Simple Snowflake Icon</title>
  <desc id="desc">A simple clean snowflake SVG icon with six symmetric branches.</desc>
  <defs>
    <linearGradient id="ice" x1="44" y1="36" x2="212" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4FCFF"/>
      <stop offset="0.35" stop-color="#CDEFFF"/>
      <stop offset="0.7" stop-color="#7CCBFF"/>
      <stop offset="1" stop-color="#EAFBFF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#E8FBFF" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#8ED9FF" flood-opacity="0.45"/>
    </filter>
    <style>
      .s { stroke: url(#ice); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .d { stroke: url(#ice); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
    <g id="arm">
      <path class="s" d="M128 128L128 42"/>
      <path class="d" d="M128 72L110 54"/>
      <path class="d" d="M128 72L146 54"/>
      <path class="d" d="M128 98L104 84"/>
      <path class="d" d="M128 98L152 84"/>
      <path class="s" d="M118 52L128 38L138 52"/>
    </g>
  </defs>

  <g filter="url(#glow)">
    <use href="#arm"/>
    <use href="#arm" transform="rotate(60 128 128)"/>
    <use href="#arm" transform="rotate(120 128 128)"/>
    <use href="#arm" transform="rotate(180 128 128)"/>
    <use href="#arm" transform="rotate(240 128 128)"/>
    <use href="#arm" transform="rotate(300 128 128)"/>
    <circle cx="128" cy="128" r="10" fill="#F7FDFF" opacity="0.95"/>
  </g>
</svg>
