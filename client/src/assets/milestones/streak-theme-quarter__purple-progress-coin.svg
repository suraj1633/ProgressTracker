<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none" role="img" aria-labelledby="title desc">
<title id="title">streak-theme-quarter — purple progress coin</title>
<desc id="desc">Clean detailed SVG icon of purple progress coin for streak-theme-quarter.</desc>
<defs>
  <linearGradient id="mainGrad" x1="60" y1="48" x2="190" y2="202" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#B582FF"/>
    <stop offset="0.45" stop-color="#764BFF"/>
    <stop offset="0.78" stop-color="#E1C8FF"/>
    <stop offset="1" stop-color="#FBF3FF"/>
  </linearGradient>
  <linearGradient id="accentGrad" x1="96" y1="62" x2="156" y2="132" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
    <stop offset="0.38" stop-color="#B582FF" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#764BFF" stop-opacity="0.25"/>
  </linearGradient>
  <radialGradient id="glowGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(128 128) rotate(90) scale(86 86)">
    <stop stop-color="#B582FF" stop-opacity="0.95"/>
    <stop offset="0.58" stop-color="#764BFF" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#FBF3FF" stop-opacity="0.01"/>
  </radialGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#B582FF" flood-opacity="0.72"/>
    <feDropShadow dx="0" dy="0" stdDeviation="11" flood-color="#764BFF" flood-opacity="0.35"/>
    <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#E1C8FF" flood-opacity="0.14"/>
  </filter>
  <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .obj { filter: url(#glow); }
    .main { fill: url(#mainGrad); }
    .accent { fill: url(#accentGrad); }
    .halo { fill: url(#glowGrad); filter: url(#soft); opacity: .65; }
    .line { stroke: #FFF; stroke-opacity: .78; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .thin { stroke-width: 2.4; opacity: .68; }
    .shine { stroke: #FFF; stroke-opacity: .52; stroke-width: 8; stroke-linecap: round; fill: none; }
  </style>
</defs>
